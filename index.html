    <script>
      // Global error handler to catch script/chunk loading errors safely without infinite reloads
      window.addEventListener('error', function(e) {
        console.error('Global error detected:', e);
        
        // Ignore image, video, audio, or link resource loading failures
        if (e && e.target && e.target !== window) {
          var tag = (e.target.tagName || '').toUpperCase();
          if (tag === 'IMG' || tag === 'AUDIO' || tag === 'VIDEO' || tag === 'LINK' || tag === 'SOURCE') {
            return;
          }
        }

        var message = (e && e.message) || '';
        var filename = (e && e.filename) || '';
        var isChunkOrLoadError = (
          message.indexOf('chunk') > -1 || 
          message.indexOf('Loading chunk') > -1 || 
          message.indexOf('Unexpected token') > -1 ||
          message.indexOf('Failed to fetch dynamically imported module') > -1
        );

        if (isChunkOrLoadError) {
          var reloadKey = 'elite_chunk_reload_done';
          if (!sessionStorage.getItem(reloadKey)) {
            sessionStorage.setItem(reloadKey, 'true');
            console.warn('Chunk loading error detected! Recovering once...');
            
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (var i = 0; i < registrations.length; i++) {
                  registrations[i].unregister();
                }
              });
            }
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(key) {
                  caches.delete(key);
                });
              });
            }
            setTimeout(function() {
              window.location.reload();
            }, 400);
          } else {
            console.error('Chunk reload already attempted once. Stopping reload loop.');
          }
        }
      }, true);

      // Reset reload key when page successfully loads
      window.addEventListener('load', function() {
        setTimeout(function() {
          try { sessionStorage.removeItem('elite_chunk_reload_done'); } catch(err) {}
        }, 3000);
      });

      // Polyfill for blocked or insecure localStorage/sessionStorage (common in mobile WebViews and private modes)
      (function() {
        var storageAvailable = true;
        try {
          var testKey = '__storage_test__';
          window.localStorage.setItem(testKey, testKey);
          window.localStorage.removeItem(testKey);
        } catch (e) {
          storageAvailable = false;
        }

        if (!storageAvailable) {
          console.warn('LocalStorage/SessionStorage is blocked or throwing errors. Polyfilling with secure in-memory storage.');
          var makeInMemoryStorage = function() {
            var store = {};
            return {
              getItem: function(key) {
                return store.hasOwnProperty(key) ? store[key] : null;
              },
              setItem: function(key, value) {
                store[key] = String(value);
              },
              removeItem: function(key) {
                delete store[key];
              },
              clear: function() {
                store = {};
              },
              key: function(index) {
                var keys = Object.keys(store);
                return keys[index] || null;
              },
              get length() {
                return Object.keys(store).length;
              }
            };
          };

          try {
            Object.defineProperty(window, 'localStorage', {
              value: makeInMemoryStorage(),
              writable: true,
              configurable: true
            });
          } catch (e) {
            window.localStorage = makeInMemoryStorage();
          }

          try {
            Object.defineProperty(window, 'sessionStorage', {
              value: makeInMemoryStorage(),
              writable: true,
              configurable: true
            });
          } catch (e) {
            window.sessionStorage = makeInMemoryStorage();
          }
        }
      })();
    </script>
